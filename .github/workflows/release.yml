name: Release

# Pushing a version tag (v0.2.0) builds the Windows installer and publishes it as a GitHub Release.
# The installed app reads the same release (latest.yml) to offer in-app updates.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Tag must match package.json version
        shell: bash
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # electron-builder uploads several files in parallel and each one tries to create the release,
      # which fails with 422 already_exists. Create it first so every upload just attaches to it.
      - name: Create the release
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installer and attach it
        run: npm run dist:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
